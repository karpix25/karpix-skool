services:
  db:
    image: postgres:15-alpine
    restart: always
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=32MB -c max_connections=200 -c random_page_cost=1.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - BOT_USERNAME=${BOT_USERNAME:?BOT_USERNAME is required}
      - APP_SHORT_NAME=${APP_SHORT_NAME:-app}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID:-}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET:-}
      - MUX_WEBHOOK_SECRET=${MUX_WEBHOOK_SECRET:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open_notebook:5055/api}
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}
      - OPEN_NOTEBOOK_ANSWER_TIMEOUT_SECONDS=${OPEN_NOTEBOOK_ANSWER_TIMEOUT_SECONDS:-900}
      - OPEN_NOTEBOOK_SOURCE_POLL_SECONDS=${OPEN_NOTEBOOK_SOURCE_POLL_SECONDS:-2}
      - OPEN_NOTEBOOK_SOURCE_POLL_ATTEMPTS=${OPEN_NOTEBOOK_SOURCE_POLL_ATTEMPTS:-150}
      - OPEN_NOTEBOOK_EMBED_SOURCES=${OPEN_NOTEBOOK_EMBED_SOURCES:-false}
      - OPEN_NOTEBOOK_TRANSFORMATION_MODEL_ID=${OPEN_NOTEBOOK_TRANSFORMATION_MODEL_ID:-}
      - LESSON_GENERATION_POLL_SECONDS=${LESSON_GENERATION_POLL_SECONDS:-5}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - WEBAPP_URL=${WEBAPP_URL:?WEBAPP_URL is required}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open_notebook_surrealdb:
    image: surrealdb/surrealdb:v2
    restart: always
    command: start --log info --user ${OPEN_NOTEBOOK_SURREAL_USER:-root} --pass ${OPEN_NOTEBOOK_SURREAL_PASSWORD:-root} rocksdb:/mydata/mydatabase.db
    user: root
    expose:
      - "8000"
    volumes:
      - open_notebook_surrealdb_data:/mydata
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    restart: always
    # Internal Open Notebook API/UI. Publish ports only when admin access is required.
    expose:
      - "5055"
      - "8502"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?OPEN_NOTEBOOK_ENCRYPTION_KEY is required}
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}
      - SURREAL_URL=ws://open_notebook_surrealdb:8000/rpc
      - SURREAL_USER=${OPEN_NOTEBOOK_SURREAL_USER:-root}
      - SURREAL_PASSWORD=${OPEN_NOTEBOOK_SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=${OPEN_NOTEBOOK_SURREAL_NAMESPACE:-open_notebook}
      - SURREAL_DATABASE=${OPEN_NOTEBOOK_SURREAL_DATABASE:-open_notebook}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    volumes:
      - open_notebook_data:/app/data
    depends_on:
      - open_notebook_surrealdb
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lesson_generation_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python -m app.workers.lesson_generation_worker
    restart: always
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SKIP_MIGRATIONS=1
      - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open_notebook:5055/api}
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}
      - OPEN_NOTEBOOK_ANSWER_TIMEOUT_SECONDS=${OPEN_NOTEBOOK_ANSWER_TIMEOUT_SECONDS:-900}
      - OPEN_NOTEBOOK_SOURCE_POLL_SECONDS=${OPEN_NOTEBOOK_SOURCE_POLL_SECONDS:-2}
      - OPEN_NOTEBOOK_SOURCE_POLL_ATTEMPTS=${OPEN_NOTEBOOK_SOURCE_POLL_ATTEMPTS:-150}
      - OPEN_NOTEBOOK_EMBED_SOURCES=${OPEN_NOTEBOOK_EMBED_SOURCES:-false}
      - OPEN_NOTEBOOK_TRANSFORMATION_MODEL_ID=${OPEN_NOTEBOOK_TRANSFORMATION_MODEL_ID:-}
      - LESSON_GENERATION_POLL_SECONDS=${LESSON_GENERATION_POLL_SECONDS:-5}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      open_notebook:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbackup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./backend
    command: python -m bot.main
    stop_grace_period: 10s
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID:-}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET:-}
      - WEBAPP_URL=${WEBAPP_URL:?WEBAPP_URL is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - PYTHONPATH=/app
      - SKIP_MIGRATIONS=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - db
      - backend
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, time; exit(0 if os.path.exists('/tmp/bot_alive') and time.time() - os.path.getmtime('/tmp/bot_alive') < 60 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  webapp:
    build:
      context: ./frontend-webapp
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:?VITE_API_URL is required}
        - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-}
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  open_notebook_data:
  open_notebook_surrealdb_data:
