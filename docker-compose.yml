services:
  db:
    image: postgres:15-alpine
    restart: always
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=32MB -c max_connections=200 -c random_page_cost=1.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - BOT_USERNAME=${BOT_USERNAME:?BOT_USERNAME is required}
      - APP_SHORT_NAME=${APP_SHORT_NAME:-app}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID:-}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET:-}
      - MUX_WEBHOOK_SECRET=${MUX_WEBHOOK_SECRET:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - NOTEBOOKLM_MCP_URL=${NOTEBOOKLM_MCP_URL:-http://notebooklm:3000/mcp}
      - NOTEBOOKLM_REMOTE_BROWSER_URL=${NOTEBOOKLM_REMOTE_BROWSER_URL:-http://notebooklm:6080}
      - NOTEBOOKLM_AUTH_PUBLIC_BASE_URL=${NOTEBOOKLM_AUTH_PUBLIC_BASE_URL:-${VITE_API_URL:-}}
      - NOTEBOOKLM_AUTH_SESSION_TTL_MINUTES=${NOTEBOOKLM_AUTH_SESSION_TTL_MINUTES:-10}
      - NOTEBOOKLM_ANSWER_TIMEOUT_SECONDS=${NOTEBOOKLM_ANSWER_TIMEOUT_SECONDS:-900}
      - LESSON_GENERATION_POLL_SECONDS=${LESSON_GENERATION_POLL_SECONDS:-5}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - WEBAPP_URL=${WEBAPP_URL:?WEBAPP_URL is required}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notebooklm:
    build:
      context: .
      dockerfile: Dockerfile.notebooklm
    restart: always
    # Internal sidecar only. Public auth links should hit the backend route,
    # which can call NOTEBOOKLM_MCP_URL over the Docker network.
    expose:
      - "3000"
      - "6080"
    environment:
      - NOTEBOOKLM_TRANSPORT=http
      - NOTEBOOKLM_HOST=0.0.0.0
      - NOTEBOOKLM_PORT=3000
      - NOTEBOOKLM_PROFILE=${NOTEBOOKLM_PROFILE:-standard}
      - NOTEBOOKLM_AI_MARKER=false
      - BROWSER_CHANNEL=${NOTEBOOKLM_BROWSER_CHANNEL:-chromium}
      - NOTEBOOKLM_BROWSER_CHANNEL=${NOTEBOOKLM_BROWSER_CHANNEL:-chromium}
      - DISPLAY=${NOTEBOOKLM_DISPLAY:-:99}
      - HEADLESS=${NOTEBOOKLM_HEADLESS:-false}
      - ANSWER_TIMEOUT_MS=${NOTEBOOKLM_ANSWER_TIMEOUT_MS:-900000}
      - NOTEBOOKLM_NOVNC_PORT=${NOTEBOOKLM_NOVNC_PORT:-6080}
      - NOTEBOOKLM_VNC_PORT=${NOTEBOOKLM_VNC_PORT:-5900}
      - NOTEBOOKLM_XVFB_SCREEN=${NOTEBOOKLM_XVFB_SCREEN:-1440x900x24}
      - NOTEBOOKLM_VNC_PASSWORD=${NOTEBOOKLM_VNC_PASSWORD:-}
    volumes:
      - notebooklm_data:/root/.local/share/notebooklm-mcp
      - notebooklm_config:/root/.config/notebooklm-mcp
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lesson_generation_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python -m app.workers.lesson_generation_worker
    restart: always
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SKIP_MIGRATIONS=1
      - NOTEBOOKLM_MCP_URL=${NOTEBOOKLM_MCP_URL:-http://notebooklm:3000/mcp}
      - NOTEBOOKLM_REMOTE_BROWSER_URL=${NOTEBOOKLM_REMOTE_BROWSER_URL:-http://notebooklm:6080}
      - NOTEBOOKLM_AUTH_PUBLIC_BASE_URL=${NOTEBOOKLM_AUTH_PUBLIC_BASE_URL:-${VITE_API_URL:-}}
      - NOTEBOOKLM_AUTH_SESSION_TTL_MINUTES=${NOTEBOOKLM_AUTH_SESSION_TTL_MINUTES:-10}
      - NOTEBOOKLM_ANSWER_TIMEOUT_SECONDS=${NOTEBOOKLM_ANSWER_TIMEOUT_SECONDS:-900}
      - LESSON_GENERATION_POLL_SECONDS=${LESSON_GENERATION_POLL_SECONDS:-5}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      notebooklm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbackup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./backend
    command: python -m bot.main
    stop_grace_period: 10s
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:-}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID:-}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET:-}
      - WEBAPP_URL=${WEBAPP_URL:?WEBAPP_URL is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - PYTHONPATH=/app
      - SKIP_MIGRATIONS=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - db
      - backend
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, time; exit(0 if os.path.exists('/tmp/bot_alive') and time.time() - os.path.getmtime('/tmp/bot_alive') < 60 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  webapp:
    build:
      context: ./frontend-webapp
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:?VITE_API_URL is required}
        - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-}
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  notebooklm_data:
  notebooklm_config:
