name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-config:
    name: Release config validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci_app
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_DB: ci_app
      SECRET_KEY: ci-test-secret-with-32-characters-minimum
      BOT_TOKEN: 123456:ci-test-token
      BOT_USERNAME: ci_test_bot
      FRONTEND_URL: https://frontend.example.com
      WEBAPP_URL: https://webapp.example.com
      VITE_API_URL: https://api.example.com
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-open-notebook-encryption-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml config --quiet

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
      SECRET_KEY: ci-test-secret-with-32-characters-minimum
      BOT_TOKEN: 123456:ci-test-token
      ENVIRONMENT: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run backend tests
        run: python -m pytest

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-webapp/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  docker-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - release-config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod backend

      - name: Build frontend production image
        run: docker build -f frontend-webapp/Dockerfile.prod --build-arg VITE_API_URL=https://api.example.com frontend-webapp
